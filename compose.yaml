name: sentinel-x

x-runtime: &runtime
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 5m
      max-file: '3'

services:
  mqtt:
    <<: *runtime
    build: ./infra
    ports:
      - '127.0.0.1:${MQTT_PORT:-8883}:8883'
    volumes:
      - credentials:/run/sentinel
      - mqtt-data:/mosquitto/data
    healthcheck:
      test: ['CMD-SHELL', 'mosquitto_pub -h localhost -p 8883 --cafile /run/sentinel/server.crt -u backend -P "$$(cat /run/sentinel/backend.password)" -t sentinel/health -m ok']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
  backend:
    <<: *runtime
    build: ./backend
    depends_on:
      mqtt:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:${API_PORT:-8080}:8000'
    volumes:
      - credentials:/run/sentinel:ro
      - database:/legacy:ro
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/health", timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
  postgres:
    <<: *runtime
    image: postgres:17-alpine
    user: postgres
    group_add: ['1883']
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_PASSWORD_FILE: /run/sentinel/postgres.password
    depends_on:
      mqtt:
        condition: service_healthy
    volumes:
      - credentials:/run/sentinel:ro
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d sentinel']
      interval: 5s
      timeout: 3s
      retries: 20
  prometheus:
    <<: *runtime
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 5s
      timeout: 3s
      retries: 20
  simulation:
    <<: *runtime
    build: ./simulation
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - credentials:/run/sentinel:ro
      - simulation-data:/data
    ports:
      - '127.0.0.1:${SIMULATION_PORT:-8091}:8091'
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ['CMD', 'python', '-c', 'import json, urllib.request; data=json.load(urllib.request.urlopen("http://localhost:8091/simulation", timeout=3)); assert data["mqtt_connected"] and data["error"] is None']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
  vision:
    <<: *runtime
    build: ./modeles-ia
    group_add: ['1883']
    depends_on:
      backend:
        condition: service_healthy
    environment:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    volumes:
      - credentials:/run/sentinel:ro
    ports:
      - '127.0.0.1:${VISION_PORT:-8090}:8090'
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8090/health", timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
  grafana:
    <<: *runtime
    image: grafana/grafana:12.3.3
    group_add: ['1883']
    entrypoint: ['sh', '/etc/sentinel/start-grafana.sh']
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/sentinel/grafana-admin.password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_PANELS_DISABLE_SANITIZE_HTML: 'true'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/sentinel.json
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      vision:
        condition: service_healthy
    volumes:
      - credentials:/run/sentinel:ro
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/start.sh:/etc/sentinel/start-grafana.sh:ro
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  simulation-data:
  credentials:
  database:
  mqtt-data:
  postgres-data:
  prometheus-data:
  grafana-data:
