apiVersion: 1
datasources:
  - name: Sentinel Prometheus
    uid: sentinel-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s
  - name: Sentinel PostgreSQL
    uid: sentinel-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: grafana_reader
    editable: false
    jsonData:
      database: sentinel
      sslmode: disable
      postgresVersion: 1700
      maxOpenConns: 5
    secureJsonData:
      password: $SENTINEL_PG_PASSWORD
