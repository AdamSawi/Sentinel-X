services:
  vision:
    build:
      context: ./modeles-ia
      dockerfile: Dockerfile.gpu
    environment:
      VISION_DEVICE: '0'
      CUDA_VISIBLE_DEVICES: '0'
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
